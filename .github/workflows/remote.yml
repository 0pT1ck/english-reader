name: 远程操控模拟器

# 手动触发，**只手动触发**。
#
# 这条 workflow 会把一台 runner 挂在那儿等人连进来，最长几十分钟。
# 让它跟着 push 跑，等于每推一次就白烧一台机器。
#
# 它存在的理由是铁律：「每个 Phase 结束由用户实际跑一遍验收清单」。
# 而这个 Phase 没有 Mac、真机要等 TestFlight，所以用户能亲手点到界面的
# 唯一办法，就是连进 runner 里的模拟器。
#
# **代价要认**：每次都要重新排队、重新起（环境留不住），走的是 VNC 所以会顿。
# 手感判断不了的那部分，留给真机那一遍。
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 挂多久（分钟），到点自动结束；也可以随时在 Actions 页面取消
        required: true
        default: "45"

jobs:
  remote:
    name: 起一台带模拟器的 Mac，等你连
    runs-on: macos-26
    # 比 minutes 多留一点，让收尾步骤跑得完。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 先检查要用的东西齐不齐
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$TS_AUTHKEY" ]   || missing="$missing TS_AUTHKEY"
          [ -n "$VNC_PASSWORD" ] || missing="$missing VNC_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺这几个仓库 secret：$missing"
            exit 1
          fi
          # 传统 VNC 的密码就是 8 位，多出来的会被悄悄截掉——
          # 然后你在 Windows 上用完整密码怎么连都连不上，而且看不出为什么。
          if [ ${#VNC_PASSWORD} -gt 8 ]; then
            echo "::error::VNC_PASSWORD 超过 8 个字符。传统 VNC 只认前 8 位，"
            echo "::error::多出来的会被悄悄截掉，然后你会连不上还查不出原因。"
            exit 1
          fi
          echo "齐了"

      - name: 选定 Xcode
        run: |
          set -euo pipefail
          APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$APP"
          xcodebuild -version

      - name: 装 XcodeGen 并生成工程
        working-directory: client/App
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: 编译并装进模拟器
        working-directory: client/App
        run: |
          set -euo pipefail
          xcodebuild build \
            -project EnglishReader.xcodeproj \
            -scheme EnglishReader \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find DerivedData -name 'EnglishReader.app' -type d | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::没编出 .app"; exit 1; }
          # 用 grep 而不是塞一段 python 进来：跨行的内联脚本在 YAML 块标量里
          # **会把缩进破掉**，而那样整份 workflow 连解析都过不去。
          # 「iPhone 17 (」后面紧跟左括号，所以不会误中 iPhone 17 Pro。
          DEVICE=$(xcrun simctl list devices available \
            | grep -m1 'iPhone 17 (' \
            | grep -oE '[0-9A-Fa-f-]{36}')
          if [ -z "$DEVICE" ]; then
            echo "::error::镜像里没有 iPhone 17 的模拟器"
            xcrun simctl list devices available | head -40
            exit 1
          fi
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # 走 Tailscale 而不是把端口捅到公网：runner 加进你自己的 tailnet，
      # 你从 Windows 直接连它的 tailnet 地址。**没有一个端口暴露在外面。**
      # 节点是 ephemeral 的，job 一结束就自己从你的设备列表里消失。
      - name: 加入 tailnet
        uses: tailscale/github-action@v4
        with:
          # 用普通的 auth key，不用 OAuth。
          # OAuth 客户端不属于任何人，所以它建出来的机器**必须挂在一个 tag 上**，
          # 而那意味着先去改 ACL——为了连一次模拟器，多出一整套要配的东西。
          # auth key 是你自己的，节点就归你，不用碰 ACL。
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: /tmp/tailscale-state/

      - name: 打开屏幕共享
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          # `-setvnclegacy` 是关键：macOS 自带的屏幕共享用的是 Apple 自己那套
          # 认证，Windows 上的普通 VNC 客户端多半谈不拢。开了传统模式之后，
          # 认的就是下面这个密码，任何 VNC 客户端都连得上。
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -privs -all
          echo "开了"

      - name: 把模拟器窗口打开，并报出连接地址
        run: |
          set -euo pipefail
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE" || open -a Simulator
          sleep 8
          xcrun simctl launch "$DEVICE" com.optick.englishreader || true
          IP=$(tailscale ip -4 | head -1)
          echo "::notice::VNC 连这里：$IP:5900"
          {
            echo "## 连进来"
            echo ""
            echo "在 Windows 的 VNC 客户端里填：**\`$IP:5900\`**"
            echo ""
            echo "密码是仓库 secret \`VNC_PASSWORD\`。"
            echo ""
            echo "进去之后模拟器窗口已经开着，App 也已经装好启动了。"
            echo "要重装重启：\`xcrun simctl install / launch\`，或者直接在模拟器里点。"
            echo ""
            echo "用完在 Actions 页面取消这次运行就行，不用等它自己到点。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 挂着等你
        run: |
          set -euo pipefail
          MINUTES=${{ github.event.inputs.minutes }}
          echo "挂 $MINUTES 分钟。随时可以在 Actions 页面取消。"
          # 每分钟出一行，一是让日志看得出还活着，二是 Actions 对长时间
          # 没有输出的步骤不友好。
          for i in $(seq 1 "$MINUTES"); do
            sleep 60
            echo "还剩 $((MINUTES - i)) 分钟"
          done

      - name: 走之前截一张
        if: always()
        run: |
          xcrun simctl io "$DEVICE" screenshot /tmp/final.png 2>/dev/null || true

      - name: 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-screenshots
          path: /tmp/*.png
          if-no-files-found: ignore
