name: 界面

# 界面这个 Phase 唯一的回路。
#
# **本机什么都验不了**：App 层要 SwiftUI、UIKit 和模拟器，Windows 上一样没有。
# 所以这里的每一次运行都是「第一次编译」——不是补一道保险，是唯一那道。
on:
  push:
    branches: [ios]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App 能编、能装、能起来
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 环境先打出来。环境坏掉和代码写错在日志里长得一模一样（坑 §1.2）。
      # Xcode 锁大版本不锁补丁号，理由同 client.yml。
      - name: 选定 Xcode 并打印环境
        run: |
          set -euo pipefail
          APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "用 $APP"
          sudo xcode-select -s "$APP"
          xcodebuild -version
          swift --version
          echo "--- 装着的模拟器 ---"
          xcrun simctl list devices available | grep -i iphone || true

      - name: 装 XcodeGen
        run: brew install xcodegen

      # 工程文件不进版本控制，每次从 project.yml 生成。
      - name: 生成工程
        working-directory: client/App
        run: |
          set -euo pipefail
          xcodegen generate
          ls -d EnglishReader.xcodeproj

      - uses: actions/cache@v4
        with:
          path: client/.build
          key: spm-app-${{ hashFiles('client/Package.resolved') }}

      # **不接管道、不写 `|| 兜底`。**坑 §6.6：`xcodebuild | xcbeautify` 那次，
      # xcodebuild 死了、xcbeautify 返回 0，于是 job 绿了 37 秒、一行没编译。
      # 编译错误要变成 annotation，2026-09-15 加。
      #
      # 本机不装 Swift（开发场地那条决定），所以**第一个拼写错误也要等 CI 才知道**。
      # 而 xcodebuild 的错误只在日志正文里，日志正文要认证才拉得到——
      # 于是「编不过」这件事能看见，「哪一行编不过」看不见，只能猜着改。
      # `::error::` 写出来的行会变成 annotation，那个不需要认证就读得到。
      #
      # `tee` 而不是管道给 grep：管道会吃掉退出码（坑 §6.6），
      # 而 `set -o pipefail` 只在这一步有效，别的会话未必记得。
      - name: 编译（iPhone 17 模拟器）
        working-directory: client/App
        run: |
          set -euo pipefail
          status=0
          xcodebuild build \
            -project EnglishReader.xcodeproj \
            -scheme EnglishReader \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" || status=$?
          if [ "$status" -ne 0 ]; then
            # 去重之后最多报 40 条：同一个错误会在每个 target 里重复出现，
            # 而 40 条之后人已经不看了。
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      # 编完要断言产物真的在，而且真是给 iOS 模拟器的。
      # 坑 §6.7：一个分不出两种情况的断言等于没有断言——所以这里读的是
      # Mach-O 的 load command（platform 7 才是 iOS 模拟器），不是 `file` 说不说 arm64。
      - name: 确认产物在，且是模拟器的
        working-directory: client/App
        run: |
          set -euo pipefail
          APP_PATH=$(find DerivedData -name 'EnglishReader.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::没找到 EnglishReader.app——上面那一步可能是空跑"
            find DerivedData -maxdepth 4 -type d | head -30
            exit 1
          fi
          echo "产物：$APP_PATH"
          BIN="$APP_PATH/EnglishReader"
          file "$BIN"
          otool -l "$BIN" | grep -A5 LC_BUILD_VERSION | head -20 | tee /tmp/platform.txt
          if grep -qiE 'platform +(7|iossimulator)' /tmp/platform.txt; then
            echo "确认：目标平台是 iOS 模拟器"
          else
            echo "::error::读不到 iOS 模拟器的平台标记。要么编的是别的平台，"
            echo "::error::要么这个检查该改了——两种都不该放过。"
            otool -l "$BIN" | head -60
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # **能编过不等于能起来。**Swift 的编译期抓不到「@main 里少了个
      # environment」这类事，那些要到跑起来才炸。
      # **能编过不等于能起来。**Swift 的编译期抓不到「@main 里少了个
      # environment」这类事，那些要到跑起来才炸。
      - name: 装进模拟器并启动
        working-directory: client/App
        run: |
          set -euo pipefail
          # 用 grep 而不是塞一段 python 进来：跨行的内联脚本在 YAML 块标量里
          # **会把缩进破掉**，而那样整份 workflow 连解析都过不去。
          # 「iPhone 17 (」后面紧跟左括号，所以不会误中 iPhone 17 Pro。
          DEVICE=$(xcrun simctl list devices available             | grep -m1 'iPhone 17 ('             | grep -oE '[0-9A-Fa-f-]{36}')
          if [ -z "$DEVICE" ]; then
            echo "::error::镜像里没有 iPhone 17 的模拟器"
            xcrun simctl list devices available | head -40
            exit 1
          fi
          echo "设备：$DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"

          # simctl launch 打印的是**宿主机的 PID**——模拟器里的 App 就是 Mac 上的
          # 一个进程。所以存活用 ps 查就行。
          #
          # 第一版查的是模拟器里的 `launchctl list`，那里根本不列 App
          # （App 归 RunningBoard 管，不是 launchd 服务），于是 App 明明
          # running-active-Visible，检查却报「起来就崩了」。
          # 坑 §6.7 的形状，只不过反过来：把好的报成了坏的。
          OUT=$(xcrun simctl launch "$DEVICE" com.optick.englishreader)
          echo "$OUT"
          PID=${OUT##*: }
          sleep 12

          # **截图放在断言前面。**放后面的话，真崩了就一张图都拿不到——
          # 而那正是最需要看一眼的时候。
          xcrun simctl io "$DEVICE" screenshot /tmp/01-launch.png

          if ! ps -p "$PID" > /dev/null 2>&1; then
            echo "::error::App 起来之后就没了（pid $PID）——多半是启动时崩的"
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact               | grep -iE 'englishreader|crash' | tail -60 || true
            exit 1
          fi
          echo "在跑，pid $PID"

      # 跑起来之后的运行时抱怨——约束冲突、缺资源、API 用错。
      # 这些不会让 App 崩，只会让界面悄悄地不对。
      - name: 运行时日志
        if: always()
        run: |
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact 2>/dev/null             | grep -iE 'englishreader' | tail -80 || echo "（没有相关日志）"

      - name: 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/*.png
          if-no-files-found: warn
