<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · English Reader</title>
<style>
  :root {
    --ground: #FAFAFC; --surface: #FFFFFF; --ink: #1B1D26; --ink-soft: #757B8E;
    --rule: #E3E4ED; --accent: #37429B; --bad: #A33A3A; --bad-soft: #F7EAEA;
    --sans: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101119; --surface: #171922; --ink: #E7E8F0; --ink-soft: #868CA0;
      --rule: #2A2D3B; --accent: #98A1EE; --bad: #E08585; --bad-soft: #2E1E1E;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink);
    font-family: var(--sans); display: flex; align-items: center;
    justify-content: center; padding: 1.5rem;
  }
  .box {
    width: 100%; max-width: 22rem; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 4px; padding: 1.8rem;
  }
  h1 { font-size: 1.15rem; margin: 0 0 0.3rem; letter-spacing: -0.01em; }
  p.hint { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 1.3rem; line-height: 1.6; }
  label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.35rem; }
  input {
    font: inherit; width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--rule);
    border-radius: 3px; background: var(--surface); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; width: 100%; margin-top: 1rem; padding: 0.55rem;
    background: var(--accent); color: #fff; border: none; border-radius: 3px;
    cursor: pointer; font-size: 0.95rem;
  }
  button:hover { opacity: 0.92; }
  .error {
    background: var(--bad-soft); color: var(--bad); font-size: 0.85rem;
    padding: 0.55rem 0.75rem; border-radius: 3px; margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <form class="box" method="post" action="/admin/login">
    <h1>English Reader</h1>
    <p class="hint">管理控制台。密码在项目根目录的 <code>.env</code> 文件里，
      变量名 <code>ER_ADMIN_SECRET</code>，首次启动时自动生成。</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="secret">管理密码</label>
    <input id="secret" name="secret" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">登录</button>
  </form>
</body>
</html>
